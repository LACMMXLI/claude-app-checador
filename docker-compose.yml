# Producción (Coolify → "Docker Compose"). Variables: ver .env.example
# Orden: db → init (roles + migraciones, idempotente en cada despliegue) → api (+ platform-api)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-checador}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Paso único por despliegue: crea/actualiza roles (requiere superusuario) y aplica migraciones (como `migrator`).
  init:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    command: ["sh", "-c", "node dist/src/cli/bootstrap.js && node dist/src/cli/migrate.js && node dist/src/cli/check-tenancy.js"]
    environment:
      BOOTSTRAP_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-checador}
      MIGRATOR_DATABASE_URL: postgresql://migrator:${MIGRATOR_PASSWORD:?}@db:5432/${POSTGRES_DB:-checador}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?}
      PLATFORM_OPS_PASSWORD: ${PLATFORM_OPS_PASSWORD:?}

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on:
      init: { condition: service_completed_successfully }
    environment:
      # La API usa SOLO app_user (NOBYPASSRLS). No recibe credenciales de plataforma ni de superusuario.
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD:?}@db:5432/${POSTGRES_DB:-checador}
      PIN_PEPPER: ${PIN_PEPPER:?define PIN_PEPPER (>= 32 caracteres)}
      PORT: ${PORT:-3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}   # cookies __Host-sid / __Host-kiosk con Secure: el panel debe servirse por HTTPS
      # Reconciliación de asistencia dentro de la API cada N segundos (0 = apagada; ver servicio `reconcile`)
      RECONCILE_INTERVAL_SEC: ${RECONCILE_INTERVAL_SEC:-0}
      # IP real del cliente (D-79; solo informativa: auditoría, sesiones, "última IP" del kiosco). La API solo es
      # accesible por la red interna, así que su par es el contenedor `web` (red privada). Se confía en UN salto:
      # el X-Forwarded-For que puso Traefik y reenvió `web`. Lo que un cliente agregue más a la izquierda se ignora.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-loopback,uniquelocal}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      NODE_ENV: production
      TZ: UTC
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Panel web (Next.js). Es el ÚNICO servicio que se publica con dominio en Coolify; reenvía /api a la API
  # por la red interna, así la cookie de sesión es de primera parte. Debe quedar detrás de Traefik (`expose`, nunca
  # `ports`): la IP real del cliente (D-79) depende de que el X-Forwarded-For lo ponga Traefik.
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      API_INTERNAL_URL: http://api:${PORT:-3000}
      PORT: 3001
    expose: ["3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Consola de plataforma (Fase 5, D-81): gestión de clientes, planes y suscripciones del SaaS ──────────────────
  # Plano SEPARADO del de los clientes: otro dominio, otra cookie, otros usuarios (operadores). Es el ÚNICO servicio
  # HTTP que recibe credenciales de plataforma (rol platform_ops, BYPASSRLS); la API de clientes (`api`) jamás las recibe.
  # Primer operador (una vez):
  #   docker compose --profile tools run --rm platform-admin create-operator --email tu@correo.com --name "Tu nombre" --password '<mín. 10>'
  platform-api:
    build: { context: ., dockerfile: apps/platform-api/Dockerfile }
    restart: unless-stopped
    depends_on:
      init: { condition: service_completed_successfully }
    environment:
      PLATFORM_DATABASE_URL: postgresql://platform_ops:${PLATFORM_OPS_PASSWORD:?}@db:5432/${POSTGRES_DB:-checador}
      PORT: 3100
      COOKIE_SECURE: ${COOKIE_SECURE:-true}     # cookie __Host-psid con Secure: la consola debe servirse por HTTPS
      # Barrido de vencimientos de suscripciones (segundos; 0 = apagado). Idempotente.
      SWEEP_INTERVAL_SEC: ${SWEEP_INTERVAL_SEC:-60}
      # IP real del operador (solo informativa: sesiones y bitácora). Misma cadena que la API de clientes:
      # Traefik → platform-web → platform-api (1 salto propio).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-loopback,uniquelocal}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      NODE_ENV: production
      TZ: UTC
    expose: ["3100"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Consola web (Next.js). Se publica con SU PROPIO dominio en Coolify (p. ej. admin.tudominio.com), distinto del panel de
  # clientes. Reenvía /api a `platform-api` por la red interna. Detrás de Traefik (`expose`, nunca `ports`).
  platform-web:
    build: { context: ., dockerfile: apps/platform-web/Dockerfile }
    restart: unless-stopped
    depends_on:
      platform-api: { condition: service_healthy }
    environment:
      PLATFORM_API_INTERNAL_URL: http://platform-api:3100
      PORT: 3002
    expose: ["3002"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Herramienta de operación (NO arranca sola):
  #   docker compose --profile tools run --rm platform create-organization --name Fatboy --slug fatboy --timezone America/Tijuana ...
  platform:
    profiles: ["tools"]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    depends_on:
      init: { condition: service_completed_successfully }
    entrypoint: ["node", "dist/src/cli/platform.js"]
    environment:
      PLATFORM_DATABASE_URL: postgresql://platform_ops:${PLATFORM_OPS_PASSWORD:?}@db:5432/${POSTGRES_DB:-checador}

  # Operadores de la consola (NO arranca sola):
  #   docker compose --profile tools run --rm platform-admin create-operator --email ... --name ... --password ...
  #   docker compose --profile tools run --rm platform-admin reset-operator-password --email ... --password ...
  #   docker compose --profile tools run --rm platform-admin list-operators
  platform-admin:
    profiles: ["tools"]
    build: { context: ., dockerfile: apps/platform-api/Dockerfile }
    depends_on:
      init: { condition: service_completed_successfully }
    entrypoint: ["node", "dist/src/cli/platform-admin.js"]
    environment:
      PLATFORM_DATABASE_URL: postgresql://platform_ops:${PLATFORM_OPS_PASSWORD:?}@db:5432/${POSTGRES_DB:-checador}

  # Reconciliación de asistencia (faltas, salidas olvidadas, jornadas abiertas largas). Idempotente.
  # NO arranca sola: programarla en Coolify como tarea periódica (p. ej. cada 5 min) o ejecutar a mano:
  #   docker compose --profile tools run --rm reconcile
  # Usa app_user (sin BYPASSRLS): cada negocio se procesa en su propio contexto.
  reconcile:
    profiles: ["tools"]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    depends_on:
      init: { condition: service_completed_successfully }
    command: ["node", "dist/src/cli/reconcile.js"]
    environment:
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD:?}@db:5432/${POSTGRES_DB:-checador}
      TZ: UTC

volumes:
  pgdata:
